<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعائتي - A special letter for kbdti</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Amiri:wght@700&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        roseGold: '#e8b4b8',
                        deepCrimson: '#4a0e17',
                        romanticRed: '#7a091a',
                        darkWine: '#0a030b',
                        softPink: '#f8c8dc'
                    },
                    fontFamily: {
                        arabicTitle: ['Amiri', 'serif'],
                        cursive: ['Great Vibes', 'cursive'],
                        script: ['Alex Brush', 'cursive'],
                        serifHeader: ['Playfair Display', 'serif'],
                        bodyText: ['Montserrat', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0a030b;
            color: #fce4ec;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Ambient Glowing Background */
        .glow-bg {
            background: radial-gradient(circle at 50% 50%, rgba(122, 9, 26, 0.45) 0%, rgba(20, 5, 22, 0.95) 60%, rgba(10, 3, 11, 1) 100%);
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(35, 8, 22, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(232, 180, 184, 0.25);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7);
        }

        /* Subtle Pulse Glow Effect on Main Button */
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(122, 9, 26, 0.6), 0 0 35px rgba(232, 180, 184, 0.2); }
            50% { box-shadow: 0 0 35px rgba(232, 180, 184, 0.5), 0 0 55px rgba(122, 9, 26, 0.8); }
        }

        .pulse-btn {
            animation: pulseGlow 3s infinite ease-in-out;
        }

        /* Floating Animation for Header */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        .floating-element {
            animation: floatSlow 4s ease-in-out infinite;
        }

        #canvas-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .content-layer {
            position: relative;
            z-index: 10;
        }

        /* Custom Scrollbar for Letter */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(10, 3, 11, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: #4a0e17;
            border-radius: 4px;
        }
    </style>
</head>
<body class="glow-bg">

    <!-- Floating Background Canvas -->
    <canvas id="canvas-particles"></canvas>

    <!-- MAIN CENTERED CONTAINER -->
    <main class="content-layer text-center p-6 max-w-lg w-full">

        <div class="floating-element mb-10">
            <!-- MAIN TITLE -->
            <h1 class="text-5xl sm:text-6xl font-bold text-white font-arabicTitle tracking-wide mb-3">
                دعائتي
            </h1>
            <!-- SUBTITLE -->
            <p class="text-roseGold/80 text-base sm:text-lg font-script tracking-wide">
                A special letter for kbdti
            </p>
        </div>

        <!-- MAIN INTERACTIVE BUTTON -->
        <button onclick="openLetter(event)" class="pulse-btn w-full py-5 px-8 rounded-2xl bg-gradient-to-r from-romanticRed via-deepCrimson to-romanticRed text-white font-medium text-lg sm:text-xl border border-roseGold/30 hover:scale-105 active:scale-95 transition-all duration-300 flex items-center justify-center shadow-2xl tracking-wide">
            <span>Open My 9lbi</span>
        </button>

    </main>

    <!-- POPUP LETTER MODAL -->
    <div id="letterModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md hidden opacity-0 transition-opacity duration-500">
        <div class="glass-card max-w-xl w-full p-6 sm:p-10 rounded-3xl border border-roseGold/30 relative transform scale-90 transition-transform duration-500 shadow-2xl max-h-[85vh] flex flex-col" id="modalCard">
            
            <!-- Close Button -->
            <button onclick="closeLetter()" class="absolute top-5 right-5 text-roseGold/70 hover:text-roseGold text-lg transition-colors w-8 h-8 rounded-full bg-darkWine/60 flex items-center justify-center border border-roseGold/20">
                <i class="fas fa-times"></i>
            </button>

            <!-- Modal Header -->
            <div class="text-center mb-6">
                <h2 class="text-3xl sm:text-4xl font-normal text-white font-script">Dearest douaa,</h2>
            </div>

            <!-- Letter Body -->
            <div class="bg-darkWine/80 p-6 sm:p-8 rounded-2xl border border-roseGold/15 overflow-y-auto text-left flex-grow my-2">
                <p id="letterText" class="text-roseGold/90 leading-relaxed font-serifHeader text-lg sm:text-xl italic whitespace-pre-line">
                    <!-- Typed text appears here -->
                </p>
            </div>

            <!-- Modal Action -->
            <div class="mt-6 text-center">
                <button onclick="closeLetter()" class="py-3 px-8 rounded-xl bg-darkWine/90 text-roseGold hover:text-white border border-roseGold/30 text-sm font-medium tracking-wider transition-all">
                    Close Letter
                </button>
            </div>

        </div>
    </div>

    <script>
        /* CANVAS PARTICLES */
        let canvas, ctx, particles = [];

        function initCanvas() {
            canvas = document.getElementById('canvas-particles');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            for (let i = 0; i < 30; i++) {
                particles.push(createParticle());
            }

            animateParticles();
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function createParticle(x, y, isBurst = false) {
            return {
                x: x !== undefined ? x : Math.random() * canvas.width,
                y: y !== undefined ? y : Math.random() * canvas.height,
                size: Math.random() * (isBurst ? 14 : 8) + 4,
                speedY: isBurst ? -(Math.random() * 3 + 1.5) : -(Math.random() * 0.6 + 0.2),
                speedX: (Math.random() - 0.5) * (isBurst ? 2.5 : 0.6),
                opacity: Math.random() * 0.6 + 0.2,
                life: isBurst ? 120 : Infinity,
                maxLife: 120
            };
        }

        function drawSoftParticle(x, y, size, opacity) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(x, y, size / 2, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(232, 180, 184, ${opacity})`;
            ctx.fill();
            ctx.restore();
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];

                p.x += p.speedX;
                p.y += p.speedY;

                if (p.life !== Infinity) {
                    p.life--;
                    p.opacity = (p.life / p.maxLife) * 0.7;
                }

                drawSoftParticle(p.x, p.y, p.size, p.opacity);

                if (p.life === Infinity && p.y < -20) {
                    p.y = canvas.height + 20;
                    p.x = Math.random() * canvas.width;
                }

                if (p.life <= 0) {
                    particles.splice(i, 1);
                    i--;
                }
            }

            requestAnimationFrame(animateParticles);
        }

        function burstParticles(x, y, amount = 40) {
            for (let i = 0; i < amount; i++) {
                particles.push(createParticle(x, y, true));
            }
        }

        /* ENGLISH ROMANTIC LETTER CONTENT */
        const letterContent = `I wanted to leave these words here for you, to remind you of how constantly you live inside my mind and heart.

I miss you so deeply throughout every single part of my day.

I miss you during the morning hours when you are at school, wondering how your day is going and wishing I could be right there beside you.

I miss you when you are at home helping your mother, thinking about your sweet nature and how effortlessly you bring warmth to everyone around you.

And most of all, I miss you late at night when the world goes quiet and you are fast asleep. In those silent hours, my heart stays awake just thinking of you, wishing you peaceful dreams and praying for your happiness and protection.

No matter what you are doing or where you are, you are always the dearest part of my life.

Forever yours.`;

        let secretIndex = 0;
        let secretTimer = null;

        function openLetter(e) {
            const rect = e.target.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;

            burstParticles(x, y, 45);

            const modal = document.getElementById('letterModal');
            const card = document.getElementById('modalCard');
            const letterEl = document.getElementById('letterText');

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                card.classList.remove('scale-90');
                card.classList.add('scale-100');
            }, 50);

            // Typewriter Animation
            letterEl.textContent = '';
            secretIndex = 0;
            clearInterval(secretTimer);

            secretTimer = setInterval(() => {
                if (secretIndex < letterContent.length) {
                    letterEl.textContent += letterContent.charAt(secretIndex);
                    secretIndex++;
                } else {
                    clearInterval(secretTimer);
                }
            }, 25);
        }

        function closeLetter() {
            const modal = document.getElementById('letterModal');
            const card = document.getElementById('modalCard');

            clearInterval(secretTimer);
            card.classList.remove('scale-100');
            card.classList.add('scale-90');
            modal.classList.add('opacity-0');

            setTimeout(() => {
                modal.classList.add('hidden');
            }, 400);
        }

        document.addEventListener('DOMContentLoaded', initCanvas);
    </script>
</body>
</html>
